name: .NET Backend CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restaurar dependencias
      run: dotnet restore ./Dumbo.API/Dumbo.API.csproj

    - name: Compilar el Backend
      run: dotnet build ./Dumbo.API/Dumbo.API.csproj -c Release --no-restore