name: Build, Push y Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Docker exige nombres en minúsculas. Así el mismo workflow sirve para
      # cualquier repo copiado de este (usa el nombre del repo automáticamente).
      - name: Calcular nombre de la imagen
        id: img
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO: ${{ github.event.repository.name }}
        run: echo "name=${DH_USER:-local}/${REPO}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      # En un PR no se hace push, así que no hace falta (ni hay secrets en forks).
      - name: Login en Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (permite construir para ARM en el runner AMD64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extraer metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build (y push solo si es push a main, no en PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Despliegue automático en la VM Linux (criterio CI/CD de la rúbrica, 4 puntos).
  # Se activa creando la variable de repositorio DEPLOY_ENABLED = true
  # (Settings → Secrets and variables → Actions → Variables).
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Calcular nombre de la imagen y del contenedor
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO: ${{ github.event.repository.name }}
        run: |
          echo "IMAGE=${DH_USER}/${REPO}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_ENV"
          echo "CONTAINER=${REPO}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_ENV"

      - name: Desplegar en la VM por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            docker pull ${{ env.IMAGE }}:latest
            docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true
            docker run -d --name ${{ env.CONTAINER }} --restart unless-stopped \
              -p ${{ vars.APP_PORT || 80 }}:80 ${{ env.IMAGE }}:latest
            docker image prune -f
