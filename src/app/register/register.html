<div class="register-container">
  <h2>Crear Cuenta (Dumbo)</h2>
  
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" formControlName="nombre" placeholder="Ingresa tu nombre">
    </div>

    <div class="form-group">
      <label for="correo">Correo</label>
      <input id="correo" type="email" formControlName="correo" placeholder="correo@ejemplo.com">
    </div>

    <div class="form-group">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password" formControlName="contrasena" placeholder="Mínimo 6 caracteres">
    </div>

    <div class="form-group">
      <label for="confirmarContrasena">Confirmar Contraseña</label>
      <input id="confirmarContrasena" type="password" formControlName="confirmarContrasena" placeholder="Repite tu contraseña">
    </div>

    <!-- Mensaje de error reactivo con Signals -->
    @if (errorMessage()) {
      <div class="error-message">
        {{ errorMessage() }}
      </div>
    }

    <button type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Registrando...' : 'Registrarse' }}
    </button>

  </form>
  
  <div class="login-link">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
  </div>
</div>
